<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Third Eye · CCTV Audit</title>
<meta name="theme-color" content="#0f1b2d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1b2d'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='13' fill='none' stroke='%2314b8a6' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%2314b8a6'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0f1b2d;--navy2:#18263d;--teal:#0d9488;--teal2:#14b8a6;--tealbg:#e6f7f5;
  --bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--ink:#152033;--ink2:#4a5a70;--ink3:#7b8899;
  --ok:#15803d;--okbg:#e7f6ec;--warn:#b45309;--warnbg:#fef3e2;--bad:#c62828;--badbg:#fdecec;--info:#1d4ed8;--infobg:#e8effd;
  --r:12px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
.hidden{display:none!important}
/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:.2px}
.brand small{display:block;font-weight:500;font-size:11px;color:#9fb0c8;letter-spacing:0}
.brandchip{background:#fff;border-radius:9px;padding:3px 8px;display:flex;align-items:center;height:42px}
.brandchip img{height:36px;width:auto;display:block}
.brand .tx{white-space:nowrap}
.brand .sep{width:1px;height:26px;background:#2c3d58}
@media(max-width:480px){.brand .tx small{display:none}.brand .tx{font-size:14px}.brandchip{height:38px}.brandchip img{height:32px}.top .chip .rl{display:none}.top .chip{max-width:120px;overflow:hidden;text-overflow:ellipsis}}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px}
.login-brand img{width:184px;max-width:70%;height:auto}
.login-brand .app{display:flex;align-items:center;gap:6px;font-weight:700;font-size:17px;color:var(--ink)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.top .chip{background:var(--navy2);color:#cfe0f5}
.demo-flag{background:#f59e0b!important;color:#111!important}
.nav{display:flex;gap:4px;background:var(--navy);padding:0 10px 8px;position:sticky;top:52px;z-index:19}
.nav button{flex:1;background:transparent;border:0;color:#9fb0c8;padding:8px 6px;border-radius:9px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.nav button.on{background:var(--navy2);color:#fff}
.nav .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{max-width:1180px;margin:0 auto;padding:14px 12px 90px}
@media(max-width:720px){
  .nav{position:fixed;bottom:0;top:auto;left:0;right:0;padding:6px 6px max(6px,env(safe-area-inset-bottom));border-top:1px solid #23344f}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px}
  .nav button .ic{font-size:18px}
}
/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.card+.card{margin-top:12px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--ink3)}
.small{font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px}
.btn:hover{border-color:#c7d0dc}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:#0b7f75}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=password],input[type=date],input[type=url],input[type=search],textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;min-height:40px;width:100%}
textarea{min-height:70px;resize:vertical}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.seg{display:inline-flex;background:#eef1f5;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mute{background:#eef1f5;color:var(--ink2)}
.sw-IVMS{background:#e8effd;color:#1d4ed8}.sw-KVMS{background:#f3e8fd;color:#7e22ce}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw;font-weight:600}
.toast.err{background:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(15,27,45,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:721px){.overlay{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:721px){.sheet{border-radius:16px}}
.spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
.spinner.dark{border-color:#cfd6df;border-top-color:var(--teal)}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 20% -10%,#1d3557 0%,var(--navy) 55%)}
.login .box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.logo{width:52px;height:52px}
/* ---------- dashboard ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh);position:relative}
.kpi .v{font-size:24px;font-weight:800;line-height:1.1;margin-top:4px}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi.bad{border-left:4px solid var(--bad)}.kpi.ok{border-left:4px solid var(--ok)}.kpi.warn{border-left:4px solid var(--warn)}.kpi.inf{border-left:4px solid var(--teal)}
.alerts{border:1px solid #f3c2c2;background:#fff7f7}
.alert{display:flex;gap:10px;padding:9px 0;border-top:1px dashed #f0d0d0;align-items:flex-start}
.alert:first-of-type{border-top:0}
.alert .t{font-weight:700}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f6f8fb;position:sticky;top:0;z-index:1;font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.3px}
td.n,th.n{text-align:right}
tr.rowbad td{background:#fff6f6}
tfoot td{font-weight:800;background:#f6f8fb;position:sticky;bottom:0}
.bars .b{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.bars .track{background:#eef1f5;border-radius:6px;height:12px;overflow:hidden}
.bars .fill{height:100%;background:var(--teal2);border-radius:6px}
.bars .fill.bad{background:#ef4444}.bars .fill.warn{background:#f59e0b}
.trend{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend .bar{width:100%;max-width:38px;background:var(--teal2);border-radius:6px 6px 0 0;min-height:2px}
.trend .bar.low{background:#f59e0b}.trend .bar.none{background:#e2e7ee}
.trend .x{font-size:11px;color:var(--ink3)}
.trend .y{font-size:11px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
/* ---------- audit list ---------- */
.prog{height:10px;background:#e3e8ef;border-radius:999px;overflow:hidden}
.prog>div{height:100%;background:var(--teal2)}
.dvr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
.dvr{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;text-align:left}
.dvr:hover{border-color:var(--teal2)}
.dvr .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff;min-height:46px;font-size:14.5px}
.btn.okb:hover{background:#116b33}
.btn.isb{border-color:#f2a7a7;color:var(--bad);min-height:46px;font-size:14.5px}
.dvr.saving{border-left:4px solid var(--ok);background:#f4fbf6}
.undo-bar{height:4px;background:#d6eedd;border-radius:4px;overflow:hidden;margin-top:6px}
.undo-bar>div{height:100%;background:var(--ok);animation:undo 4s linear forwards}
@keyframes undo{from{width:100%}to{width:0}}
.grp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:6px 0 -2px;font-weight:800;color:var(--ink2);font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.grp:after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chips button.on{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.banner{display:flex;align-items:center;gap:10px;background:var(--infobg);border:1px solid #c9d8fb;border-radius:10px;padding:10px 12px;margin-top:12px;font-weight:600;color:#1e3a8a}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.qa input{flex:1;min-width:120px;min-height:36px;padding:6px 10px}
.sess-list{display:grid;gap:8px}
.sess{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;min-height:62px}
.sess:hover{border-color:var(--teal2)}.sess b{display:block;font-size:15px}.sess small{display:block;color:var(--ink3);font-size:11.5px}
.sess .si,.sess-other .si{font-size:22px}.sess .sgo{font-weight:700;color:var(--teal);white-space:nowrap}
.sess-other{border:1.5px dashed #b6c2d2;border-radius:12px;padding:12px;margin-top:10px;background:#fafcff}
.sync{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.sync .spinner{width:12px;height:12px;border-width:2px}
.s-busy{background:#1d3a5c;color:#cfe0f5}.s-off{background:#f59e0b;color:#111}.s-fail{background:#d03b3b;color:#fff}.s-ok{background:#0ca30c;color:#fff}
.qrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.nextup{border:2px solid var(--teal2);background:linear-gradient(180deg,#f0fbf9,#fff);border-radius:14px;padding:12px;margin-top:12px;box-shadow:0 4px 14px rgba(13,148,136,.15)}
.nextup .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:520px}
.nextup .lbl2{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.6px;text-transform:uppercase}
.dvr.qsave{border-left:4px solid #1d3a5c;background:#f6f9fc}.dvr.qfail{border-left:4px solid var(--bad);background:#fff6f6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,184,166,.45)}100%{box-shadow:0 0 0 12px rgba(20,184,166,0)}}.nextup{animation:pulse 1.4s ease-out 2}
.evg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:8px 0}
.evg.evs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin:4px 0}
.evt{position:relative;display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#e9edf2 linear-gradient(135deg,#eef2f6,#dde3ea);border:1px solid var(--line);text-decoration:none}
.evt img{width:100%;height:100%;object-fit:cover;display:block}
.evt .evn{position:absolute;left:6px;top:6px;background:rgba(15,27,45,.75);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.evt .evo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(15,27,45,.8));color:#fff;font-size:11px;padding:10px 8px 5px;opacity:0;transition:opacity .15s}
.evt:hover .evo{opacity:1}.evt:not(:has(img)) .evo{opacity:1;background:none;color:var(--ink2);top:40%;text-align:center}
.evcard{max-width:420px}
.hist{border:1px solid #f3d7a4;background:#fffaf0;border-radius:10px;padding:10px 12px;margin-top:10px}.hist summary{cursor:pointer}
.hist-ok{border-color:#cfe9d7;background:#f6fbf8;font-size:13px}
.hrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed #efd9b0;flex-wrap:wrap}.hrow:first-of-type{border-top:0}
.hrow .evg{width:min(260px,100%);margin:0}
.pastrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pa{display:inline-flex;flex-direction:column;border-radius:8px;padding:4px 8px;font-size:11px;border:1px solid var(--line);background:#fff}.pa b{font-size:12px}
.pa-good b{color:#0a7d0a}.pa-warn b{color:#8a5a00}.pa-crit b{color:#b42318}
.cam.had{box-shadow:inset 0 0 0 2px #f59e0b}.cam .hadl{font-size:10px;color:#8a5a00;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.hero-l{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-r{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:1000px){.hero-r{grid-template-columns:repeat(4,1fr)}}
.stchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.stchip .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.st-good{background:#e7f6ec;color:#0a7d0a}.st-warn{background:#fff3db;color:#8a5a00}.st-crit{background:#fdeaea;color:#b42318}.st-none{background:#eef1f5;color:#4a5a70}
.ht{border:1px solid var(--line);border-radius:12px;padding:12px;border-top:5px solid #c9ced6;background:#fff}
.ht-good{border-top-color:#0ca30c}.ht-warn{border-top-color:#fab219}.ht-crit{border-top-color:#d03b3b}
.ht-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink2)}.ht-i{font-size:16px}
.ht-dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#c9ced6}.ht-good .ht-dot{background:#0ca30c}.ht-warn .ht-dot{background:#fab219}.ht-crit .ht-dot{background:#d03b3b}
.ht-v{font-size:28px;font-weight:800;line-height:1.15;margin-top:4px}.ht-v small{font-size:15px;color:var(--ink3);font-weight:600}
.ht-s{font-size:12px;color:var(--ink2);margin-top:2px}
.mbar{height:6px;background:#eef1f5;border-radius:6px;margin-top:6px;overflow:hidden}.mbar i{display:block;height:100%;background:#0d9488;border-radius:6px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.achip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.achip b{font-size:16px}
.okline{margin-top:10px;color:#0a7d0a;font-weight:700}
.toplist{margin-top:10px}.trow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}.trow:hover{background:#f8fafc}
.sev{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:none;background:#9aa4b2}
.s-Critical{background:#d03b3b}.s-High{background:#ec835a}.s-Medium{background:#fab219;color:#0b0b0b}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink2);margin:8px 0 4px}.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-style:normal;font-weight:800}
.mapcity{margin-top:10px}.mapc-h{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.tile{border:0;border-radius:8px;padding:7px 8px;text-align:left;cursor:pointer;color:#fff;min-height:58px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.tile .ti{position:absolute;top:5px;right:7px;font-weight:800;font-size:13px}
.tile .tn{font-weight:700;font-size:12.5px;padding-right:18px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}.tile .ts2{font-size:10.5px;opacity:.92}
.t-good{background:#0ca30c}.t-warn{background:#fab219;color:#0b0b0b}.t-crit{background:#d03b3b}.t-none{background:#e3e6eb;color:#4a5a70}
.tile:hover{outline:3px solid rgba(15,27,45,.25)}
.lvls{display:flex;gap:8px;margin-bottom:10px}.lvl{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.lvl span{font-size:18px}.lvl b{display:block;font-size:20px}.lvl small{color:var(--ink3)}
.hb-r{display:grid;grid-template-columns:minmax(120px,46%) 1fr 26px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb-t{background:#eef1f5;border-radius:4px;height:12px}.hb-t i{display:block;height:100%;background:#0d9488;border-radius:4px}
.segbar{display:flex;gap:2px;height:26px;border-radius:6px;overflow:hidden}.segbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.mk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;box-shadow:var(--sh)}
.mk span{font-size:22px;grid-row:span 2}.mk b{font-size:20px}.mk small{color:var(--ink3);font-size:11.5px}
details.more>summary{cursor:pointer;font-weight:700;color:var(--info)}

};
const SAMPLE = {"howto":[{"ID":"HT-RAISE-TICKET","Title":"Raise a Fix Engine ticket for the vendor","Software":"All","Who":"Auditor","Minutes":3,"Steps":"You do NOT fix this yourself \u2014 the vendor does. Your job is a clear ticket.|In Third Eye open Exceptions and find this issue card|Tap \ud83d\udccb Copy ticket text (it already has the diagnosis, fix steps and screenshot link)|Open Fix Engine and create a new ticket \u2014 paste the text into the description|Copy the ticket ID Fix Engine gives you|Back in Third Eye, paste it in 'Paste Fix Engine ticket ID' and tap Save|In the next audits, check this camera / DVR again \u2014 when it works, the app moves it to 'Recovered \u2013 Verify'","Success Check":"The card shows \ud83c\udfab with the ticket ID and status 'Ticket Raised'","Say To Site":"","Media URL":"","Source":"Third Eye app :: ","Confidence":"Third Eye app"},{"ID":"HT-ASK-IT","Title":"Send this to IT","Software":"All","Who":"Auditor","Minutes":2,"Steps":"This needs IT, not you|In Third Eye tap \ud83d\udccb Copy ticket text on the issue card|Send it to the IT contact on WhatsApp / email (or raise in Fix Engine if IT uses it)|Note who you sent it to in the ticket field (e.g. 'IT \u2013 Ravi WhatsApp')|Re-check in the next audit","Success Check":"IT has acknowledged and the issue card has a ticket / note","Say To Site":"","Media URL":"","Source":"Third Eye app :: ","Confidence":"Third Eye app"},{"ID":"HT-OPS-ESCALATE","Title":"Escalate to Ops / supervisor","Software":"All","Who":"Auditor","Minutes":2,"Steps":"This is a site-operations decision, not a repair|Copy the ticket text from the issue card|Send it to your supervisor / ops head on WhatsApp with one line on what you need (UPS, staff briefing, relocation, cleaning schedule)|Keep the exception open until ops confirms","Success Check":"Supervisor has replied with an owner and a date","Say To Site":"","Media URL":"","Source":"Third Eye app ::  ;; Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-MARK-RECOVERED","Title":"Mark as working again","Software":"All","Who":"Auditor","Minutes":1,"Steps":"Re-check live view (or playback) and confirm it really works|In the next audit simply mark this camera / DVR as working \u2014 Third Eye moves the issue to 'Recovered \u2013 Verify' automatically|Or open the issue card \u203a More details \u203a choose 'Recovered - Verify' \u203a Update status|A supervisor verifies and closes it with the root cause","Success Check":"Card shows 'Recovered \u2013 Verify' (green)","Say To Site":"","Media URL":"","Source":"Third Eye app :: ","Confidence":"Third Eye app"},{"ID":"HT-MARK-OK","Title":"No ticket needed \u2014 mark it OK","Software":"All","Who":"Auditor","Minutes":1,"Steps":"The check passed, so this is not a fault|In the audit form choose the OK option (e.g. 'Playback OK' or camera live) instead of an issue|If you already raised it, ask a supervisor to resolve it with root cause 'Not a fault'","Success Check":"No new exception was created for this","Say To Site":"","Media URL":"","Source":"Third Eye app :: ","Confidence":"Third Eye app"},{"ID":"HT-LOG-CAMERA","Title":"Report the affected cameras one by one","Software":"All","Who":"Auditor","Minutes":2,"Steps":"In the audit form mark the DVR as online|Tap each frozen / blank camera number to mark it not live|Pick the issue for each camera and answer its troubleshooting questions|Submit \u2014 each camera becomes its own exception","Success Check":"Each affected camera shows as a separate exception","Say To Site":"","Media URL":"","Source":"Third Eye app :: ","Confidence":"Third Eye app"},{"ID":"HT-CHANGE-ISSUE","Title":"Change to the correct issue","Software":"All","Who":"Auditor","Minutes":1,"Steps":"In the audit form tap 'change' next to the issue|Pick the issue the answers point to (e.g. 'Night vision (IR) not working' or 'HDD error / not detected')|Answer the new troubleshooting questions","Success Check":"The issue name on the form matches the real problem","Say To Site":"","Media URL":"","Source":"Third Eye app :: ","Confidence":"Third Eye app"},{"ID":"HT-NIGHT-CHECK","Title":"Check night vision properly","Software":"All","Who":"Auditor","Minutes":2,"Steps":"Night vision only works in the dark \u2014 daytime checks are not valid|Do this check in the evening audit (or ask site to switch off lights near the camera for 1 minute)|Look at the live view: the picture should turn black-and-white and stay clear|If it goes fully black or very dark, raise the IR issue","Success Check":"You checked the camera in low light and recorded what you saw","Say To Site":"Please switch off the lights near camera {cam} for one minute while I check the CCTV.","Media URL":"","Source":"Hikvision tech bulletin \u2013 IR / dark at night :: https://us-legacy.hikvision.com/sites/default/files/tb/technical_bulletin_camera_ir_troubleshooting_v2.pdf","Confidence":"Vendor doc"},{"ID":"HT-LOGIN-LOCK","Title":"Account locked \u2014 stop and wait","Software":"All","Who":"Auditor","Minutes":1,"Steps":"Stop trying the password \u2014 each wrong try can extend the lock|Hikvision devices lock the user for about 30 minutes after repeated wrong passwords; a DVR reboot also clears it|Wait 30 minutes, or ask the site to restart the DVR (see 'Restart the DVR')|Ask IT / admin for the correct current password before trying again","Success Check":"You can log in again after the wait / reboot","Say To Site":"","Media URL":"","Source":"LearnCCTV \u2013 Hikvision login lock (30 min) :: https://learncctv.com/?p=4003","Confidence":"Third-party guide"},{"ID":"HT-LIVE-CHECK","Title":"Open live view and check the camera","Software":"IVMS","Who":"Auditor","Minutes":2,"Steps":"Open iVMS-4200 and log in|Click Main View (Live View)|On the left, find the outlet's DVR in the device list|Drag the camera (or the whole DVR) into the video window|Wait up to 30 seconds \u2014 the clock on the picture should be moving","Success Check":"Picture is visible and the on-screen clock is moving","Say To Site":"","Media URL":"","Source":"Hikvision \u2013 iVMS-4200 Playback walkthrough (official) :: https://www.hikvision.com/content/dam/hikvision/ca/how-to-document/IVMS-4200-part-4-playback.pdf ;; Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf","Confidence":"Vendor doc"},{"ID":"HT-LIVE-CHECK","Title":"Open live view and check the camera","Software":"KVMS","Who":"Auditor","Minutes":2,"Steps":"Open KVMS Pro and log in|Click Live View|On the left, find the outlet's DVR|Double-click / drag the camera into a video window|Wait up to 30 seconds \u2014 the clock on the picture should be moving","Success Check":"Picture is visible and the clock is moving","Say To Site":"","Media URL":"","Source":"CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Needs field check"},{"ID":"HT-STREAM","Title":"Switch Main stream / Sub stream","Software":"IVMS","Who":"Auditor","Minutes":1,"Steps":"In Main View, right-click the camera picture|Click Stream|Choose Main Stream if the camera won't load (sub-stream missing) \u2014 or Sub Stream if the picture / playback is slow on weak internet|Wait 20 seconds for the picture","Success Check":"The picture loads","Say To Site":"","Media URL":"","Source":"Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf","Confidence":"Vendor doc"},{"ID":"HT-STREAM","Title":"Switch Main stream / Sub stream","Software":"KVMS","Who":"Auditor","Minutes":1,"Steps":"Right-click the camera picture in Live View|Look for Stream / Main stream / Sub stream (sometimes 'Extra stream')|Choose Main if it won't load, Sub if it is slow|Wait 20 seconds","Success Check":"The picture loads","Say To Site":"","Media URL":"","Source":"CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Needs field check"},{"ID":"HT-MAXCONN","Title":"'Max connections' error","Software":"IVMS","Who":"Auditor","Minutes":2,"Steps":"This means too many people / screens are watching this DVR at the same time|Close iVMS on any other PC and the mobile app on other phones that are watching this outlet|Try again after 1 minute|If it still fails, ask the site to restart the DVR","Success Check":"Live view opens","Say To Site":"","Media URL":"","Source":"Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf","Confidence":"Vendor doc"},{"ID":"HT-PLAYBACK","Title":"Search playback (recording) for a time","Software":"IVMS","Who":"Auditor","Minutes":3,"Steps":"Open iVMS-4200 \u203a click Remote Playback|Click the calendar icon \u2014 dates with a flag/mark have recordings|Pick the date and the time period you want|On the left, drag the camera (or the whole DVR) into the playback window \u2014 it searches automatically|To jump to an exact time: right-click the picture \u203a Accurate Positioning \u203a enter date and time \u203a OK|A continuous coloured bar on the timeline = it is recording; gaps = no recording","Success Check":"Video plays for the date/time you searched (write down any gaps)","Say To Site":"","Media URL":"","Source":"Hikvision \u2013 iVMS-4200 Playback walkthrough (official) :: https://www.hikvision.com/content/dam/hikvision/ca/how-to-document/IVMS-4200-part-4-playback.pdf ;; Netview \u2013 iVMS-4200 setup & troubleshooting :: https://netviewcctv.co.uk/blog/ivms-4200","Confidence":"Vendor doc"},{"ID":"HT-PLAYBACK","Title":"Search playback (recording) for a time","Software":"KVMS","Who":"Auditor","Minutes":3,"Steps":"Open KVMS Pro \u203a click Playback|On the left, tick the DVR and the camera(s)|Choose the date (and start/end time)|Click Search \u2014 a coloured bar appears on the timeline ight-click \u203a Main Menu \u203a Storage \u203a HDD Manager (Disk Manager)|Read the Status and write it down exactly (Normal / Error / Uninitialised / No disk)|\u26a0 Do NOT press Format / Initialise \u2014 that erases footage","Success Check":"You noted the exact HDD status and free space","Say To Site":"Please open the DVR menu on the monitor: right-click \u203a Main Menu \u203a Storage \u203a HDD Manager \u203a and send me a photo of the screen. Do not press format.","Media URL":"","Source":"Dahua \u2013 NVR hard disk & recording settings (Storage \u203a Disk Manager, record mode Auto) :: https://manuals.plus/dahua/nvr-hard-disk-and-recording-settings-manual ;; CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Needs field check"},{"ID":"HT-IVMS-PERMISSION","Title":"Give the iVMS user live view / playback permission","Software":"IVMS","Who":"IT","Minutes":5,"Steps":"Needs the DVR admin password \u2014 done by IT / admin|iVMS-4200 \u203a Device Management \u203a select the DVR \u203a Remote Configuration|System \u203a User Management|Select the user the auditors use \u203a Modify|Tick Remote Live View and Remote Playback for all cameras \u203a Save|Or simply re-add the device in iVMS using the admin account","Success Check":"Auditor can open live view / playback without a permission error","Say To Site":"","Media URL":"","Source":"Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf","Confidence":"Vendor doc"},{"ID":"HT-READD","Title":"Re-add the DVR in the software","Software":"IVMS","Who":"IT","Minutes":5,"Steps":"Done by IT / admin (needs DVR IP, port and admin password)|iVMS-4200 \u203a Device Management \u203a select the old entry \u203a Delete|Click Add \u203a Adding mode: IP/Domain (not cloud \u2014 cloud blocks Remote Configuration)|Enter a name (outlet code), the DVR IP / domain, port 8000, user admin and the password \u203a Add|Check the status shows Online and cameras appear in Main View","Success Check":"Device shows Online and cameras load","Say To Site":"","Media URL":"","Source":"Netview \u2013 iVMS-4200 installer guide (Remote Configuration \u203a Storage) :: https://netviewcctv.co.uk/blog/ivms-4200-installer-guide ;; Netview \u2013 iVMS-4200 setup & troubleshooting :: https://netviewcctv.co.uk/blog/ivms-4200 ;; Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf","Confidence":"Third-party guide"},{"ID":"HT-READD","Title":"Re-add the DVR in the software","Software":"KVMS","Who":"IT","Minutes":5,"Steps":"Done by IT / admin (needs DVR IP / serial, port and password)|KVMS Pro \u203a Devices (Device Manager) \u203a delete the old entry|Add \u203a Manual add \u203a enter name (outlet code), IP or serial / cloud ID, port, username, password \u203a Save|Check it shows online and cameras open in Live View","Success Check":"Device shows online and cameras load","Say To Site":"","Media URL":"","Source":"CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Needs field check"},{"ID":"HT-EDIT-PASSWORD","Title":"Update the saved DVR password in the software","Software":"IVMS","Who":"IT","Minutes":3,"Steps":"Get the new password from IT / admin \u2014 never guess (wrong tries lock the account)|iVMS-4200 \u203a Device Management \u203a select the DVR \u203a Modify (pencil)|Type the new password \u203a OK|Check the status turns Online","Success Check":"Device shows Online","Say To Site":"","Media URL":"","Source":"Netview \u2013 iVMS-4200 setup & troubleshooting :: https://netviewcctv.co.uk/blog/ivms-4200","Confidence":"Third-party guide"},{"ID":"HT-EDIT-PASSWORD","Title":"Update the saved DVR password in the software","Software":"KVMS","Who":"IT","Minutes":3,"Steps":"Get the new password from IT / admin \u2014 never guess|KVMS Pro \u203a Devices \u203a select the DVR \u203a Edit / Modify|Type the new password \u203a Save|Check it shows online","Success Check":"Device shows online","Say To Site":"","Media URL":"","Source":"CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Needs field check"},{"ID":"HT-UPDATE-CLIENT","Title":"Install the latest iVMS-4200","Software":"IVMS","Who":"IT","Minutes":15,"Steps":"Download only from the official Hikvision site (link in Source)|Close iVMS-4200|Run the installer and keep the same install folder (your devices stay)|Open iVMS and check the devices are still listed and online","Success Check":"iVMS opens and the version number is the latest","Say To Site":"","Media URL":"","Source":"Hikvision \u2013 iVMS-4200 download :: https://www.hikvision.com/en/support/download/software/ivms4200-series/","Confidence":"Vendor doc"},{"ID":"HT-UPDATE-CLIENT","Title":"Install the latest KVMS Pro","Software":"KVMS","Who":"IT","Minutes":15,"Steps":"Get the installer from the CP Plus vendor or the official CP Plus website only \u2014 never a random download site|KVMS Pro version 2.01.0.T.190521 or older has a known security flaw that leaks passwords \u2014 update it|Note your device list first (or export it), then install|Open KVMS Pro and check every DVR is listed and online","Success Check":"KVMS opens, version is newer than 2.01, all DVRs online","Say To Site":"","Media URL":"","Source":"CISA advisory \u2013 update KVMS Pro (\u22642.01 leaks credentials) :: https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-02 ;; CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Vendor doc"},{"ID":"HT-GCMOB-CHECK","Title":"Cross-check on the gCMOB mobile app","Software":"KVMS","Who":"Auditor","Minutes":3,"Steps":"gCMOB is CP Plus's mobile app for the same DVRs|Open gCMOB on the phone that has this outlet's DVR added|Open Live (and Playback if needed) for the same camera|If it works on gCMOB but not KVMS \u2192 the PC software is the problem (send to IT)|If it fails on both \u2192 the DVR / camera is the problem","Success Check":"You know whether the fault is the PC software or the DVR","Say To Site":"","Media URL":"","Source":"CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf","Confidence":"Needs field check"},{"ID":"HT-SCHEDULE","Title":"Check / fix the recording schedule","Software":"IVMS","Who":"Vendor","Minutes":5,"Steps":"Usually done by the vendor or IT on the DVR screen|Right-click \u203a Menu \u203a Record \u203a Schedule|Select the camera (channel)|Tick 'Enable Schedule'|Set Continuous for all day, every day (or as your policy says) \u203a Apply|Use Copy to apply to all cameras \u203a Apply|Auditor verifies next shift with 'Search playback'","Success Check":"Playback shows a continuous bar for the new hours","Say To Site":"","Media URL":"","Source":"SecurityCamCenter \u2013 Hikvision recording schedule (Menu \u203a Record \u203a Schedule) :: https://securitycamcenter.com/set-up-recording-schedule-hikvision-nvr/","Confidence":"Third-party guide"},{"ID":"HT-SCHEDULE","Title":"Check / fix the recording schedule","Software":"KVMS","Who":"Vendor","Minutes":5,"Steps":"Usually done by the vendor or IT on the DVR screen|Right-click \u203a Main Menu \u203a Storage (or Management \u203a Storage) \u203a Schedule|Select the channel, set Regular / Continuous for all day \u203a Copy to all channels \u203a Save|Also check Record mode (Storage \u203a Record / Record Control): Main stream = Auto (Schedule)|Auditor verifies next shift with 'Search playback'","Success Check":"Playback shows a continuous bar for the new hours","Say To Site":"","Media URL":"","Source":"Dahua \u2013 schedule record setup (Storage \u203a Schedule) :: https://ametawiki.ametagroup.com/docs/how-to-setup-dahua-schedule-record ;; Dahua \u2013 NVR hard disk & recording settings (Storage \u203a Disk Manager, record mode Auto) :: https://manuals.plus/dahua/nvr-hard-disk-and-recording-settings-manual","Confidence":"Needs field check"},{"ID":"HT-OVERWRITE","Title":"Turn on HDD overwrite","Software":"IVMS","Who":"Vendor","Minutes":3,"Steps":"Without overwrite the DVR STOPS recording when the disk is full|On the DVR screen: Menu \u203a HDD (or Storage) \u203a Advanced / Record Information|Tick Overwrite \u203a Apply|Auditor verifies next shift: playback shows today's recording","Success Check":"Overwrite ticked and today's footage is recording","Say To Site":"","Media URL":"","Source":"Hikvision DVR manual \u2013 Enabling HDD overwrite :: https://www.manualowl.com/m/Hikvision/DS-7316HQHI-SH/Manual/683131?page=129","Confidence":"Vendor doc"},{"ID":"HT-OVERWRITE","Title":"Turn on HDD overwrite","Software":"KVMS","Who":"Vendor","Minutes":3,"Steps":"Without overwrite the DVR STOPS recording when the disk is full|On the DVR screen: right-click \u203a Main Menu \u203a Storage \u203a Basic|Set 'HDD Full' (Disk Full) to Overwrite \u203a Apply|Auditor verifies next shift: playback shows today's recording","Success Check":"HDD Full = Overwrite and today's footage is recording","Say To Site":"","Media URL":"","Source":"Dahua-platform DVR (Lorex) \u2013 Storage \u203a Basic \u203a HDD Full = Overwrite :: https://help.lorextechnology.com/link/portal/57356/57366/Article/3451/dvr-configuring-storage-overwrite","Confidence":"Third-party guide"},{"ID":"HT-SET-TIME","Title":"Fix the DVR date / time (NTP)","Software":"IVMS","Who":"IT","Minutes":5,"Steps":"Set the time on the DVR, not on each camera|On the DVR screen: Menu \u203a Configuration \u203a General \u203a set the correct time zone, date and time|For automatic time: in the same time screen (or Network \u203a NTP) tick 'Synchronize via NTP server' (e.g. pool.ntp.org) \u203a Apply|If the date resets to an old year after power cuts, the DVR clock battery needs replacing (vendor)","Success Check":"On-screen clock matches your phone","Say To Site":"","Media URL":"","Source":"Hikvision DVR manual \u2013 time / NTP :: https://manualshive.com/en/manual/hikvision/hvi-s/2132168?page=17","Confidence":"Vendor doc"},{"ID":"HT-SET-TIME","Title":"Fix the DVR date / time (NTP)","Software":"KVMS","Who":"IT","Minutes":5,"Steps":"Set the time on the DVR, not on each camera|On the DVR screen: right-click \u203a Main Menu \u203a System \u203a General \u203a Date & Time \u2014 set time zone (GMT+5:30), date and time|Enable NTP if shown (Network \u203a NTP) \u203a Apply|If the date resets after power cuts, the DVR clock battery needs replacing (vendor)","Success Check":"On-screen clock matches your phone","Say To Site":"","Media URL":"","Source":"Ops practice :: ","Confidence":"Needs field check"},{"ID":"HT-SITE-POWERCYCLE","Title":"Restart the DVR (power-cycle)","Software":"All","Who":"Site","Minutes":5,"Steps":"Call the site and stay on the line|Ask them to find the DVR (black box near the monitor / router, with many cables at the back)|Switch off the DVR power plug at the wall (or pull the adapter plug)|Wait 30 seconds|Switch it back on \u2014 lights come on, the DVR beeps / starts|Wait 3 minutes, then check live view again in iVMS / KVMS","Success Check":"Live view loads and the clock is moving","Say To Site":"Hi, CCTV check from Third Eye. Please switch OFF the DVR (CCTV recorder box) at the wall plug, wait 30 seconds, then switch it ON. Tell me once the lights are back. Do not unplug any other cable.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-SITE-DVR-POWER","Title":"Check DVR power at site","Software":"All","Who":"Site","Minutes":3,"Steps":"Ask the site to look at the DVR front \u2014 is any light ON?|If no light: check the wall switch is ON and the adapter plug is pushed in at both ends (wall and DVR)|Check if the UPS / extension board is ON (plug a phone charger to test the socket)|Tell them not to open the DVR","Success Check":"DVR light is ON","Say To Site":"Hi, CCTV check from Third Eye. Please check the DVR (CCTV recorder box): is any light ON in front? If not, check the wall switch and that the power adapter is firmly plugged in at both ends. Send me a photo please.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-SITE-ROUTER","Title":"Restart the internet router at site","Software":"All","Who":"Site","Minutes":5,"Steps":"Ask the site to find the internet router (box with blinking lights, usually near the DVR)|Switch it off at the plug, wait 30 seconds, switch it on|Wait 3 minutes for the lights to settle|Ask someone to open any website on the shop Wi-Fi to confirm internet is back","Success Check":"Site Wi-Fi works and the DVR comes online in iVMS / KVMS","Say To Site":"Hi, CCTV check from Third Eye. Please switch OFF the internet router (Wi-Fi box), wait 30 seconds and switch it ON. After 3 minutes, check if Wi-Fi internet works and tell me.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-SITE-CAM-POWER","Title":"Check camera power supply and cable","Software":"All","Who":"Site","Minutes":5,"Steps":"Ask the site to find the CCTV power supply (small box / SMPS, usually near the DVR or above the ceiling near cameras)|Is its light ON? If not, check its plug and switch|At the back of the DVR, check the cable for this camera number is pushed in and twisted-locked (BNC)|Send a photo of the power supply and the DVR back panel","Success Check":"Power supply light is ON and the camera cable is firmly in","Say To Site":"Hi, CCTV check from Third Eye. Camera {cam} is not showing. Please check the CCTV power supply box near the DVR \u2014 is its light ON? Also check the camera cable at the back of the DVR is firmly connected. Please send a photo.","Media URL":"","Source":"Swann \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865","Confidence":"Third-party guide"},{"ID":"HT-SITE-CLEAN-LENS","Title":"Clean the camera lens / dome","Software":"All","Who":"Site","Minutes":5,"Steps":"Ask the site to use a dry, soft cloth (no water, no chemicals) and a safe ladder|Gently wipe the dome / lens glass of camera {cam}|In kitchens, wipe grease with a slightly damp soft cloth, then dry|Do not twist or move the camera|You re-check live view while they are still there","Success Check":"Picture is clear in live view","Say To Site":"Hi, CCTV check from Third Eye. Camera {cam} looks blurry. Please gently wipe the camera glass with a dry soft cloth (do not move the camera). Tell me once done so I can check.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-SITE-CLEAR-VIEW","Title":"Clear what is blocking the camera","Software":"All","Who":"Site","Minutes":5,"Steps":"Send the site the screenshot showing what is blocked|Ask them to move the stock / board / item out of the camera's view|Do not move the camera itself|You re-check live view while they are still there","Success Check":"Key area is fully visible again","Say To Site":"Hi, CCTV check from Third Eye. Camera {cam} view is blocked (see screenshot). Please move the item blocking it \u2014 do not move the camera. Tell me once done.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-SITE-IR-TEST","Title":"Test night vision (IR) at site","Software":"All","Who":"Site","Minutes":3,"Steps":"Ask the site person to cover the small light sensor on the camera with a finger (or switch off the lights)|The small red lights around the lens should glow red within a few seconds|At the same time you watch live view \u2014 the picture should turn black-and-white|If no red glow \u2192 IR LEDs faulty (vendor)","Success Check":"Red IR lights glow and the picture turns black-and-white","Say To Site":"Hi, CCTV check from Third Eye. Please cover the front of camera {cam} with your hand for 10 seconds and tell me if small red lights glow around the lens.","Media URL":"","Source":"Hikvision tech bulletin \u2013 IR / dark at night :: https://us-legacy.hikvision.com/sites/default/files/tb/technical_bulletin_camera_ir_troubleshooting_v2.pdf","Confidence":"Vendor doc"},{"ID":"HT-SITE-SAFE-OFF","Title":"Make it safe \u2014 switch off camera power","Software":"All","Who":"Site","Minutes":2,"Steps":"Water or a cut cable can cause a short circuit|Ask the site to switch off the CCTV power supply for that camera (or the DVR if unsure) at the wall|Do not touch wet cables|Raise the vendor ticket immediately","Success Check":"Power is off and the area is safe","Say To Site":"Hi, CCTV safety: camera {cam} is damaged / wet. Please switch OFF the CCTV power supply at the wall now and do not touch the cables. Vendor will come.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"},{"ID":"HT-SITE-ELECTRICIAN","Title":"Ask the site electrician to check power","Software":"All","Who":"Site","Minutes":3,"Steps":"Tell the site manager which socket / board the CCTV is on|Ask the electrician to check voltage and loose connections there|Ask if heavy equipment (fryer, AC, compressor) is on the same line|Suggest moving CCTV to a UPS line","Success Check":"Electrician has checked and confirmed","Say To Site":"Hi, CCTV keeps flickering / dropping. Please ask the electrician to check the socket the CCTV is plugged into (voltage / loose connection) and whether heavy kitchen equipment is on the same line.","Media URL":"","Source":"Ops practice :: ","Confidence":"Ops practice"}],"devices":[{"DVR Code":"ANR01.BLR","Type":"Outlet","Outlet Name":"Akshay Nagar","City":"BLR","Software":"IVMS","DVR Serial No":"J33808724","Cameras Installed":5,"Critical Cameras":"","Outlet Contact":"","Active":"Y"},{"DVR Code":"BSK01.BLR","Type":"Outlet","Outlet Name":"Banashankari","City":"BLR","Software":"IVMS","DVR Serial No":"G63663497","Cameras Installed":4,"Critical Cameras":"","Outlet Contact":""
