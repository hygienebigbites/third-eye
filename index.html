Camera power adapter (SMPS) or loose cable/connector","First Check":"Ask site to check SMPS light and reseat camera connector","Owner":"Vendor","Severity":"High"},{"Level":"Camera","Issue":"Black / blank screen","Likely Cause":"Camera power or sensor failure","First Check":"Ask site to restart camera power","Owner":"Vendor","Severity":"High"},{"Level":"Camera","Issue":"Blurry / foggy image","Likely Cause":"Dirty lens (grease/steam) or focus","First Check":"Ask site to wipe lens with a dry cloth","Owner":"Site staff","Severity":"Medium"},{"Level":"Camera","Issue":"View blocked / obstructed","Likely Cause":"Stock, racks or boards in front","First Check":"Ask site to remove obstruction","Owner":"Site staff","Severity":"Medium"},{"Level":"Camera","Issue":"Camera position changed","Likely Cause":"Bumped or moved","First Check":"Ask site to re-align camera","Owner":"Site staff","Severity":"Medium"},{"Level":"Camera","Issue":"Intermittent / flickering","Likely Cause":"Loose connection, voltage drop","First Check":"Check connectors and power","Owner":"Vendor","Severity":"Medium"},{"Level":"Camera","Issue":"Night vision (IR) not working","Likely Cause":"IR LEDs failed","First Check":"Re-check in low light","Owner":"Vendor","Severity":"Medium"},{"Level":"Camera","Issue":"Colour issue / pink or green tint","Likely Cause":"Sensor or cable fault","First Check":"Note and raise ticket","Owner":"Vendor","Severity":"Low"},{"Level":"Camera","Issue":"Physical / water damage","Likely Cause":"Rain or washdown exposure","First Check":"Ask site to switch off camera power","Owner":"Vendor","Severity":"High"},{"Level":"Camera","Issue":"Wrong date / time on screen","Likely Cause":"DVR clock not synced","First Check":"Note correct time","Owner":"Vendor","Severity":"Low"},{"Level":"Playback","Issue":"No recording found","Likely Cause":"Hard disk failed or recording switched off","First Check":"Check HDD status in device settings","Owner":"Vendor","Severity":"Critical"},{"Level":"Playback","Issue":"HDD error / not detected","Likely Cause":"Hard disk failure","First Check":"Check HDD status in device settings","Owner":"Vendor","Severity":"Critical"},{"Level":"Playback","Issue":"Recording gap (partial)","Likely Cause":"Power cuts or HDD errors","First Check":"Note the gap time window","Owner":"Vendor","Severity":"High"},{"Level":"Playback","Issue":"HDD full / overwrite off","Likely Cause":"Overwrite disabled","First Check":"Vendor to enable overwrite","Owner":"Vendor","Severity":"High"},{"Level":"Playback","Issue":"Recording not enabled for channel","Likely Cause":"Recording schedule not set for that camera","First Check":"Vendor to set schedule","Owner":"Vendor","Severity":"High"},{"Level":"Playback","Issue":"Playback slow / not loading","Likely Cause":"Low internet bandwidth at site","First Check":"Retry once on sub-stream / lower quality","Owner":"IT","Severity":"Medium"},{"Level":"Playback","Issue":"Wrong date / time in recording","Likely Cause":"DVR clock wrong","First Check":"Note correct time","Owner":"Vendor","Severity":"Medium"}],"settings":[{"Key":"Org Name","Value":"Hygiene Bigbite","Notes":"Shown in WhatsApp summary and reports"},{"Key":"Shift 1 Name","Value":"Morning","Notes":""},{"Key":"Shift 1 Start","Value":"09:00","Notes":"24h HH:MM"},{"Key":"Shift 1 End","Value":"13:00","Notes":""},{"Key":"Shift 2 Name","Value":"Evening","Notes":""},{"Key":"Shift 2 Start","Value":"17:00","Notes":""},{"Key":"Shift 2 End","Value":"21:00","Notes":""},{"Key":"Playback Check Time","Value":"Yesterday 11:00 AM","Notes":"Time slot auditors play back"},{"Key":"SLA Hours Critical","Value":"4","Notes":"Hours to fix before SLA breach"},{"Key":"SLA Hours High","Value":"24","Notes":""},{"Key":"SLA Hours Medium","Value":"48","Notes":""},{"Key":"SLA Hours Low","Value":"72","Notes":""},{"Key":"Ticket Missing Alert Hours","Value":"2","Notes":"Alert if no Fix Engine ticket ID after these hours"},{"Key":"Repeat Threshold","Value":"3","Notes":"Failures per DVR in window to flag repeat offender"},{"Key":"Repeat Window Days","Value":"30","Notes":""},{"Key":"Low Live % Alert","Value":"70","Notes":"Outlet live % below this = critical alert"},{"Key":"Evidence Required","Value":"Y","Notes":"Screenshot mandatory when an exception is raised"},{"Key":"History Days","Value":"30","Notes":"Days of audits loaded into the app"},{"Key":"Evidence Folder ID","Value":"","Notes":"Blank = auto-create 'Third Eye Evidence' folder in Drive"},{"Key":"Fix Engine URL","Value":"","Notes":"Optional: link opened after copying ticket text"},{"Key":"Guide IVMS Live","Value":"Open iVMS-4200 | Click Main View (Live View) | Expand the outlet's device in the left list | Double-click the device to load all cameras | Wait 10-15 sec and check every tile shows video","Notes":"Steps separated by |"},{"Key":"Guide IVMS Playback","Value":"Click Remote Playback | Tick ONE camera of the outlet | Select yesterday's date in calendar | Click Search - check the timeline bar | Click 11:00 AM on the timeline and play 30 sec","Notes":"Steps separated by |"},{"Key":"Guide KVMS Live","Value":"Open KVMS Pro Lite | Click Live View | Click the outlet's arrow mark to expand | Drag/double-click the device to open all channels | Wait 10-15 sec; all cameras green in side menu","Notes":"Steps separated by |"},{"Key":"Guide KVMS Playback","Value":"Open the Playback tab | Select the outlet device and ONE channel | Choose yesterday's date | Click Search - check the timeline bar | Click 11:00 AM and play 30 sec","Notes":"Steps separated by |"},{"Key":"Report Email To","Value":"","Notes":"Comma-separated emails that receive the audit report"},{"Key":"Report Email CC","Value":"","Notes":"Optional CC emails"},{"Key":"App Link","Value":"","Notes":"Your GitHub Pages link, e.g. https://name.github.io/third-eye/ (used in report links)"},{"Key":"Troubleshoot Required","Value":"Y","Notes":"Y = auditor must answer troubleshooting questions for each issue"},{"Key":"Report Months","Value":"3","Notes":"Months shown in the Report view"},{"Key":"Target Healthy %","Value":"98","Notes":"Target % of cameras fully healthy \u2014 sets GREEN / AMBER / RED status in reports"}],"troubleshoot":[{"Level":"DVR","Issue":"DVR offline / not reachable","Software":"IVMS","Step":1,"Question":"What does iVMS show for this device in Device Management?","Answers":"Offline|Device not in list|Online but cameras don't load","Diagnosis":"Offline=DVR not reachable over network|Device not in list=Device removed from iVMS client|Online but cameras don't load=Stream / permission error on the client","Tip":"Device Management \u2192 Status column","Solution":"Offline=IT: if site power and internet are fine, check DVR IP / port / router mapping #HT-ASK-IT|Device not in list=IT: re-add the device in iVMS with the admin account (operator accounts can lack live-view rights) #HT-READD|Online but cameras don't load=Auditor: right-click the tile \u203a Stream \u203a Main Stream and retry (sub-stream failure) #HT-STREAM >> Auditor: if 'max connections' error, close other viewers / ask IT to reboot DVR #HT-MAXCONN >> IT: update iVMS-4200 to the latest version #HT-UPDATE-CLIENT","Source":"Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf ;; Hikvision \u2013 iVMS-4200 latest version :: https://www.hikvision.com/en/support/download/software/ivms4200-series/"},{"Level":"DVR","Issue":"DVR offline / not reachable","Software":"KVMS","Step":1,"Question":"What colour / status does KVMS show for this device?","Answers":"Grey / Offline|Not in device list|Green but no video","Diagnosis":"Grey / Offline=DVR not reachable over network|Not in device list=Device removed from KVMS|Green but no video=Stream / client issue","Tip":"Side menu device icon colour","Solution":"Grey / Offline=IT: check network cable, DVR IP / gateway and port forwarding #HT-ASK-IT|Not in device list=IT: re-add the DVR in KVMS Pro #HT-READD|Green but no video=Auditor: cross-check the same DVR in gCMOB mobile app #HT-GCMOB-CHECK >> IT: if gCMOB works, the KVMS client is at fault \u2014 update KVMS Pro (versions \u22642.01.0.T.190521 also have a CISA-listed credential leak) #HT-UPDATE-CLIENT","Source":"CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf ;; CISA advisory ICSA-23-082-02 \u2013 KVMS Pro \u22642.01 credential leak :: https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-02 ;; Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR offline / not reachable","Software":"All","Step":2,"Question":"Call the site: is the DVR power light ON?","Answers":"Yes|No|Could not reach site","Diagnosis":"No=No power at DVR","Tip":"","Solution":"No=Site: check the socket / UPS and the DVR adapter plug #HT-SITE-DVR-POWER >> Vendor: if the socket is live but the DVR stays dark, test / replace the DVR power adapter #HT-RAISE-TICKET","Source":"Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR offline / not reachable","Software":"All","Step":3,"Question":"Is the site internet working (router lights / staff can browse)?","Answers":"Yes|No|Not sure","Diagnosis":"No=Site internet down \u2014 ISP / IT issue, not CCTV vendor","Tip":"Ask staff to open any website on their phone using shop Wi-Fi","Solution":"No=Site: restart the router #HT-SITE-ROUTER >> IT: raise with ISP \u2014 no CCTV vendor ticket needed #HT-ASK-IT","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"DVR","Issue":"DVR offline / not reachable","Software":"All","Step":4,"Question":"After site restarts router + DVR (off 30 sec), is it online in 3 min?","Answers":"Yes|No|Not tried","Diagnosis":"Yes=Recovered after restart \u2014 watch for repeats|No=Needs vendor visit \u2014 DVR / network configuration","Tip":"","Solution":"Yes=Auditor: mark Recovered - Verify; re-check next shift #HT-MARK-RECOVERED|No=Vendor: on-site check of DVR network settings (IP, gateway, port) and LAN cable #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) ::  ;; Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR hanged / video frozen","Software":"All","Step":1,"Question":"Is the clock on the live video moving?","Answers":"Yes|No","Diagnosis":"No=DVR hanged \u2014 power-cycle needed","Tip":"","Solution":"No=Site: power-cycle the DVR (off 30 sec, on) #HT-SITE-POWERCYCLE >> Auditor: re-check live view after 3 minutes #HT-LIVE-CHECK","Source":"Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR hanged / video frozen","Software":"All","Step":2,"Question":"Are all cameras frozen or only some?","Answers":"All|Only some","Diagnosis":"All=DVR processor hang|Only some=Camera-side fault \u2014 report those cameras as camera issues","Tip":"","Solution":"Only some=Auditor: log those channels as camera 'No video / video loss' and troubleshoot per camera #HT-LOG-CAMERA","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"DVR","Issue":"DVR hanged / video frozen","Software":"All","Step":3,"Question":"After power-cycle, is video moving again?","Answers":"Yes|No|Not tried","Diagnosis":"No=DVR needs firmware / hardware check \u2014 vendor visit|Yes=Recovered after restart \u2014 watch for repeats","Tip":"","Solution":"Yes=Auditor: mark Recovered - Verify; if it repeats within 7 days raise vendor ticket #HT-MARK-RECOVERED|No=Vendor: check HDD and power adapter (manual lists HDD fault, weak power, dust/heat as boot causes) #HT-RAISE-TICKET >> Vendor: update DVR firmware #HT-RAISE-TICKET","Source":"Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR power issue","Software":"All","Step":1,"Question":"Is the DVR power light ON?","Answers":"Yes|No","Diagnosis":"No=No power reaching DVR","Tip":"","Solution":"No=Site: confirm adapter is plugged in at both ends #HT-SITE-DVR-POWER","Source":"Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR power issue","Software":"All","Step":2,"Question":"Do other devices on the same socket work?","Answers":"Yes|No|Don't know","Diagnosis":"No=Socket / MCB fault \u2014 electrician|Yes=DVR adapter / power supply faulty \u2014 vendor","Tip":"","Solution":"No=Site: electrician to fix socket / MCB #HT-SITE-ELECTRICIAN|Yes=Vendor: replace DVR power adapter #HT-RAISE-TICKET","Source":"Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"DVR","Issue":"DVR power issue","Software":"All","Step":3,"Question":"Is the DVR connected to a UPS?","Answers":"Yes|No|Don't know","Diagnosis":"No=No UPS \u2014 DVR goes down in every power cut","Tip":"","Solution":"No=Ops: propose UPS for this outlet (recording also stops during cuts) #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"DVR","Issue":"Login / password failure","Software":"IVMS","Step":1,"Question":"What message does iVMS show?","Answers":"Incorrect user name or password|User locked|No permission|Other error","Diagnosis":"Incorrect user name or password=Password changed|User locked=Account locked after repeated wrong passwords|No permission=Account lacks remote live view / playback rights","Tip":"Stop retrying \u2014 every wrong try extends the lock","Solution":"Incorrect user name or password=Auditor: do NOT retry more than twice #HT-LOGIN-LOCK >> IT: share the updated password and edit it in iVMS Device Management #HT-EDIT-PASSWORD|User locked=Auditor: stop retrying; wait 30 minutes or ask site to reboot the DVR #HT-LOGIN-LOCK >> IT: check Login Security / illegal-login-lock settings #HT-ASK-IT|No permission=IT: log in as admin \u203a Remote Configuration \u203a System \u203a User Management \u203a Modify User \u203a tick remote live view / playback #HT-IVMS-PERMISSION","Source":"LearnCCTV \u2013 Hikvision login lock (error 153, 30 min) :: https://learncctv.com/?p=4003 ;; Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf"},{"Level":"DVR","Issue":"Login / password failure","Software":"KVMS","Step":1,"Question":"What message does KVMS show?","Answers":"Wrong password / login failed|Account locked|Other error","Diagnosis":"Wrong password / login failed=Password changed|Account locked=Account locked after repeated wrong passwords","Tip":"","Solution":"Wrong password / login failed=Auditor: do NOT retry more than twice #HT-LOGIN-LOCK >> IT: share the updated password and edit the device in KVMS #HT-EDIT-PASSWORD|Account locked=Auditor: stop retrying; wait for the lock period or ask site to reboot the DVR #HT-LOGIN-LOCK >> IT: unlock / reset the user from the DVR local menu #HT-ASK-IT","Source":"Ops practice (not vendor-sourced) ::  ;; CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf"},{"Level":"DVR","Issue":"Login / password failure","Software":"All","Step":2,"Question":"Did the vendor / IT change the DVR password recently?","Answers":"Yes|No|Don't know","Diagnosis":"Yes=Saved password in client is outdated","Tip":"","Solution":"Yes=IT: update the saved password in iVMS / KVMS and in the Third Eye Devices notes #HT-EDIT-PASSWORD","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"DVR","Issue":"Software / app not loading","Software":"All","Step":1,"Question":"Does the other CCTV software (iVMS / KVMS) open?","Answers":"Yes|No","Diagnosis":"No=PC or office network problem \u2014 IT","Tip":"","Solution":"No=IT: check the audit PC and office internet #HT-ASK-IT","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"DVR","Issue":"Software / app not loading","Software":"All","Step":2,"Question":"After restarting the app / PC?","Answers":"Still not working|Works now|Not tried","Diagnosis":"Still not working=Client software needs update / reinstall|Works now=Temporary app glitch \u2014 no ticket needed","Tip":"","Solution":"Still not working=IT: install the latest client (iVMS-4200 from Hikvision; KVMS Pro from CP Plus) #HT-UPDATE-CLIENT >> IT: KVMS Pro \u22642.01.0.T.190521 must be updated (CISA advisory) #HT-UPDATE-CLIENT|Works now=Auditor: continue the audit \u2014 no ticket #HT-MARK-OK","Source":"Hikvision \u2013 iVMS-4200 latest version :: https://www.hikvision.com/en/support/download/software/ivms4200-series/ ;; CISA advisory ICSA-23-082-02 \u2013 KVMS Pro \u22642.01 credential leak :: https://www.cisa.gov/news-events/ics-advisories/icsa-23-082-02"},{"Level":"DVR","Issue":"Software / app not loading","Software":"All","Step":3,"Question":"What do you see?","Answers":"Update / licence message|Crash / blank window|Network error","Diagnosis":"Network error=Office internet issue \u2014 IT|Update / licence message=Client needs update \u2014 IT|Crash / blank window=Client install corrupted","Tip":"","Solution":"Network error=IT: fix office internet #HT-ASK-IT|Update / licence message=IT: install the latest client version #HT-UPDATE-CLIENT|Crash / blank window=IT: reinstall the client software (latest version) #HT-UPDATE-CLIENT","Source":"Hikvision \u2013 iVMS-4200 latest version :: https://www.hikvision.com/en/support/download/software/ivms4200-series/ ;; Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"No video / video loss","Software":"IVMS","Step":1,"Question":"What does iVMS show on the tile?","Answers":"'Video loss' / 'No video'|'Camera is disabled or not connected'|Black tile, no message","Diagnosis":"'Video loss' / 'No video'=Signal not reaching DVR \u2014 camera power or cable|'Camera is disabled or not connected'=Channel offline on the DVR|Black tile, no message=Stream issue on the client","Tip":"","Solution":"'Video loss' / 'No video'=Site: check the camera's power supply light and that the BNC plug is firmly in at the DVR #HT-SITE-CAM-POWER|'Camera is disabled or not connected'=Vendor: check camera power / cable to the DVR and that the channel is enabled #HT-RAISE-TICKET >> IT: if the camera shows on the site monitor, delete and re-add the DVR in iVMS #HT-READD|Black tile, no message=Auditor: right-click \u203a Stream \u203a Main Stream and retry #HT-STREAM","Source":"SecurityCamCenter \u2013 iVMS-4200 'camera disabled or not connected' :: https://securitycamcenter.com/how-to-fix-error-code-1602-on-ivms-4200/ ;; Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf ;; Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"No video / video loss","Software":"KVMS","Step":1,"Question":"What does KVMS show on the tile?","Answers":"'Video loss' / 'No video'|Black tile, no message","Diagnosis":"'Video loss' / 'No video'=Signal not reaching DVR \u2014 camera power or cable|Black tile, no message=Stream issue on the client","Tip":"","Solution":"'Video loss' / 'No video'=Site: check the camera's power supply light and that the BNC plug is firmly in at the DVR #HT-SITE-CAM-POWER|Black tile, no message=Auditor: cross-check the channel on gCMOB / site monitor #HT-GCMOB-CHECK >> Vendor: if blank on the site monitor too, check privacy mask settings and camera #HT-RAISE-TICKET","Source":"Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134 ;; Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"No video / video loss","Software":"All","Step":2,"Question":"Ask site: is the camera's power supply (SMPS) light ON?","Answers":"Yes|No|Couldn't check","Diagnosis":"No=Power supply (SMPS) failed","Tip":"SMPS is the small box near the DVR or camera","Solution":"No=Vendor: replace the power supply #HT-RAISE-TICKET >> Vendor: re-check every camera fed by it #HT-RAISE-TICKET","Source":"Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"No video / video loss","Software":"All","Step":3,"Question":"Are other cameras on the same power supply working?","Answers":"Yes|No|Don't know","Diagnosis":"Yes=Cable / connector or camera fault on this channel|No=Common power supply down","Tip":"","Solution":"Yes=Vendor: swap this camera's BNC into a known-good DVR port \u2014 if video returns, the DVR port is faulty; if not, test cable / camera #HT-RAISE-TICKET >> Vendor: bench-test the camera with a known-good power and short cable #HT-RAISE-TICKET|No=Vendor: replace the shared power supply / splitter #HT-RAISE-TICKET","Source":"Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"Black / blank screen","Software":"All","Step":1,"Question":"Is the image black even in daylight?","Answers":"Yes|No, only at night","Diagnosis":"Yes=Sensor fault or lens covered|No, only at night=Night vision (IR) not working \u2014 change issue to IR","Tip":"","Solution":"No, only at night=Auditor: change the issue to 'Night vision (IR) not working' and troubleshoot that #HT-CHANGE-ISSUE","Source":"Hikvision tech bulletin \u2013 IR / dark at night :: https://us-legacy.hikvision.com/sites/default/files/tb/technical_bulletin_camera_ir_troubleshooting_v2.pdf"},{"Level":"Camera","Issue":"Black / blank screen","Software":"All","Step":2,"Question":"Is anything covering the lens (tape, cloth, dirt)?","Answers":"Yes|No|Couldn't check","Diagnosis":"Yes=Lens covered \u2014 site to uncover, no vendor needed","Tip":"","Solution":"Yes=Site: uncover / clean the lens #HT-SITE-CLEAN-LENS >> Auditor: re-check live view and close as fixed #HT-MARK-RECOVERED","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Black / blank screen","Software":"All","Step":3,"Question":"After restarting camera power, is the picture back?","Answers":"Yes|No|Not tried","Diagnosis":"No=Camera faulty|Yes=Recovered after restart \u2014 watch for repeats","Tip":"","Solution":"No=Vendor: bench-test the camera; replace if faulty #HT-RAISE-TICKET|Yes=Auditor: mark Recovered - Verify #HT-MARK-RECOVERED","Source":"Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"Blurry / foggy image","Software":"All","Step":1,"Question":"Is there grease or steam near this camera (kitchen)?","Answers":"Yes|No","Diagnosis":"Yes=Lens dirty from grease / steam","Tip":"","Solution":"Yes=Site: wipe lens / dome with a soft cloth #HT-SITE-CLEAN-LENS >> Ops: add this camera to weekly cleaning #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Blurry / foggy image","Software":"All","Step":2,"Question":"After site wipes the lens, is it clear?","Answers":"Yes|No|Not yet","Diagnosis":"No=Focus / lens issue \u2014 vendor to refocus|Yes=Fixed by cleaning \u2014 no vendor needed","Tip":"","Solution":"No=Vendor: refocus / adjust lens #HT-RAISE-TICKET|Yes=Auditor: close as fixed by cleaning #HT-MARK-RECOVERED","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Blurry / foggy image","Software":"All","Step":3,"Question":"Are there water drops inside the dome?","Answers":"Yes|No|Couldn't check","Diagnosis":"Yes=Moisture inside housing","Tip":"","Solution":"Yes=Vendor: dry and reseal the housing, or replace #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"View blocked / obstructed","Software":"All","Step":1,"Question":"What is blocking the view?","Answers":"Stock / racks|Boards / posters|Equipment moved|Other","Diagnosis":"Stock / racks=Camera line of sight blocked by stock|Boards / posters=Board blocking view|Equipment moved=Layout change blocks view","Tip":"","Solution":"Stock / racks=Site: clear the line of sight #HT-SITE-CLEAR-VIEW >> Ops: brief staff #HT-OPS-ESCALATE|Boards / posters=Site: remove / move the board #HT-SITE-CLEAR-VIEW|Equipment moved=Ops: decide to move equipment or relocate camera #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"View blocked / obstructed","Software":"All","Step":2,"Question":"Can the site clear it now?","Answers":"Yes|No","Diagnosis":"No=Camera needs relocation","Tip":"","Solution":"No=Ops + Vendor: relocate the camera #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Camera position changed","Software":"All","Step":1,"Question":"Is the key area (counter / door / cash) still visible?","Answers":"Yes, partly|No","Diagnosis":"No=Critical area not covered \u2014 re-align today","Tip":"","Solution":"No=Vendor: re-align today (critical area uncovered) #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Camera position changed","Software":"All","Step":2,"Question":"Was there cleaning / work near the camera?","Answers":"Yes|No|Don't know","Diagnosis":"Yes=Moved during work","Tip":"","Solution":"Yes=Ops: brief cleaning / maintenance staff not to touch cameras #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Camera position changed","Software":"All","Step":3,"Question":"Is the camera mount loose?","Answers":"Yes|No|Couldn't check","Diagnosis":"Yes=Loose mount","Tip":"","Solution":"Yes=Vendor: tighten / replace the mount and re-align #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Intermittent / flickering","Software":"All","Step":1,"Question":"When does it flicker?","Answers":"Every few seconds|Few times an hour|Only at night","Diagnosis":"Only at night=Power drops when IR switches on \u2014 power supply weak","Tip":"","Solution":"Only at night=Vendor: test the power supply under IR load; replace if voltage drops #HT-RAISE-TICKET","Source":"Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"Intermittent / flickering","Software":"All","Step":2,"Question":"Does it match lights / equipment switching on?","Answers":"Yes|No|Not sure","Diagnosis":"Yes=Voltage drop","Tip":"","Solution":"Yes=Site: electrician to check supply #HT-SITE-ELECTRICIAN >> Ops: put CCTV on UPS #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Intermittent / flickering","Software":"All","Step":3,"Question":"Do other cameras on this DVR also flicker?","Answers":"Yes|No","Diagnosis":"Yes=DVR or common power supply issue|No=Loose cable / connector on this channel","Tip":"","Solution":"Yes=Vendor: check the common power supply and DVR #HT-RAISE-TICKET|No=Vendor: re-terminate the BNC / connector; test with a known-good cable #HT-RAISE-TICKET","Source":"Swann support \u2013 DVR video loss troubleshooting :: https://support.swann.com/hc/articles/4747272083865"},{"Level":"Camera","Issue":"Night vision (IR) not working","Software":"All","Step":1,"Question":"Did you check with lights off / at night?","Answers":"Yes|No","Diagnosis":"No=Re-check in low light before raising ticket","Tip":"","Solution":"No=Auditor: re-check in the evening shift before raising a ticket #HT-NIGHT-CHECK","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Night vision (IR) not working","Software":"All","Step":2,"Question":"How does the image look in the dark?","Answers":"Fully black|Very dark / grainy|White glare","Diagnosis":"Fully black=IR LEDs or IR-cut filter faulty|Very dark / grainy=Weak IR or IR-cut filter stuck|White glare=IR reflecting off glass / wall","Tip":"","Solution":"Fully black=Site: cover the camera's light sensor with a finger \u2014 IR LEDs should glow red #HT-SITE-IR-TEST >> Vendor: if they don't, IR board faulty \u2014 replace IR / camera #HT-RAISE-TICKET|Very dark / grainy=Site: cover the light sensor and check IR switches on #HT-SITE-IR-TEST >> Vendor: check IR-cut filter; replace camera if faulty #HT-RAISE-TICKET|White glare=Vendor: re-angle the camera away from nearby walls / glass #HT-RAISE-TICKET","Source":"Hikvision tech bulletin \u2013 IR / dark at night :: https://us-legacy.hikvision.com/sites/default/files/tb/technical_bulletin_camera_ir_troubleshooting_v2.pdf"},{"Level":"Camera","Issue":"Colour issue / pink or green tint","Software":"All","Step":1,"Question":"What kind of colour issue?","Answers":"Pink / purple|Green|Black & white in daytime","Diagnosis":"Black & white in daytime=Day/night (IR-cut) switch stuck|Pink / purple=IR-cut filter stuck in night position|Green=Signal / format mismatch","Tip":"","Solution":"Black & white in daytime=Vendor: check IR-cut filter / day-night setting; replace camera if stuck #HT-RAISE-TICKET|Pink / purple=Vendor: check IR-cut filter; replace camera if stuck #HT-RAISE-TICKET|Green=Vendor: check the camera signal type / video format on the DVR (PAL/NTSC, CVI/TVI/AHD) #HT-RAISE-TICKET","Source":"Hikvision tech bulletin \u2013 IR / dark at night :: https://us-legacy.hikvision.com/sites/default/files/tb/technical_bulletin_camera_ir_troubleshooting_v2.pdf ;; Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134"},{"Level":"Camera","Issue":"Colour issue / pink or green tint","Software":"All","Step":2,"Question":"After restarting camera power?","Answers":"Same|Fixed","Diagnosis":"Same=Camera replacement needed","Tip":"","Solution":"Same=Vendor: replace the camera #HT-RAISE-TICKET|Fixed=Auditor: mark Recovered - Verify #HT-MARK-RECOVERED","Source":"Hikvision tech bulletin \u2013 IR / dark at night :: https://us-legacy.hikvision.com/sites/default/files/tb/technical_bulletin_camera_ir_troubleshooting_v2.pdf"},{"Level":"Camera","Issue":"Physical / water damage","Software":"All","Step":1,"Question":"What damage do you see?","Answers":"Water inside|Broken housing / lens|Cable cut","Diagnosis":"Cable cut=Cable replacement|Water inside=Seal / housing failed|Broken housing / lens=Housing / lens broken","Tip":"","Solution":"Cable cut=Vendor: replace the cable run #HT-RAISE-TICKET|Water inside=Vendor: replace / reseal the camera #HT-RAISE-TICKET|Broken housing / lens=Vendor: replace the camera #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Physical / water damage","Software":"All","Step":2,"Question":"Has the site switched off camera power for safety?","Answers":"Yes|No","Diagnosis":"No=Electrical safety risk","Tip":"","Solution":"No=Site: switch off camera power now (safety) #HT-SITE-SAFE-OFF","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Wrong date / time on screen","Software":"All","Step":1,"Question":"How far off is the time?","Answers":"Few minutes|Hours / days|Wrong year","Diagnosis":"Hours / days=DVR clock not synced \u2014 footage times unreliable|Wrong year=DVR clock reset","Tip":"","Solution":"Few minutes=IT: set NTP time sync on the DVR #HT-SET-TIME|Hours / days=IT: correct DVR time and enable NTP \u2014 note the offset for any footage already pulled #HT-SET-TIME|Wrong year=Vendor: replace the DVR clock (CMOS) battery #HT-RAISE-TICKET >> IT: set time + NTP #HT-SET-TIME","Source":"Hikvision DVR manual \u2013 playback troubleshooting :: https://manualshive.com/en/manual/hikvision/ud01394b/2132219?page=215 ;; Ops practice (not vendor-sourced) :: "},{"Level":"Camera","Issue":"Wrong date / time on screen","Software":"All","Step":2,"Question":"Are all cameras on this DVR wrong?","Answers":"Yes|No","Diagnosis":"Yes=Fix time on the DVR (not camera)","Tip":"","Solution":"Yes=IT: fix time on the DVR (not per camera) and enable NTP #HT-SET-TIME|No=Vendor: fix time on that IP camera #HT-RAISE-TICKET","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Playback","Issue":"No recording found","Software":"IVMS","Step":1,"Question":"What does iVMS show when you search?","Answers":"'No record file found'|Timeline empty|No permission / error|Timeout","Diagnosis":"'No record file found'=Nothing recorded \u2014 check HDD and schedule|No permission / error=Account lacks remote playback right|Timeout=Remote access / bandwidth issue","Tip":"","Solution":"'No record file found'=Auditor: confirm the channel and date/time searched are correct #HT-PLAYBACK|Timeline empty=Auditor: confirm the channel and date/time searched are correct #HT-PLAYBACK|No permission / error=IT: Remote Configuration \u203a User Management \u203a Modify User \u203a tick remote playback #HT-IVMS-PERMISSION|Timeout=Auditor: switch to sub-stream / lower resolution and retry #HT-STREAM","Source":"Hikvision DVR manual \u2013 playback troubleshooting :: https://manualshive.com/en/manual/hikvision/ud01394b/2132219?page=215 ;; Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf"},{"Level":"Playback","Issue":"No recording found","Software":"KVMS","Step":1,"Question":"What does KVMS show when you search?","Answers":"'No record found'|Timeline empty|Error / timeout","Diagnosis":"'No record found'=Nothing recorded \u2014 check HDD and schedule|Error / timeout=Remote access / bandwidth issue","Tip":"","Solution":"'No record found'=Auditor: confirm channel and date/time #HT-PLAYBACK|Timeline empty=Auditor: confirm channel and date/time #HT-PLAYBACK|Error / timeout=Auditor: retry on sub-stream; cross-check on gCMOB #HT-STREAM","Source":"Dahua-platform DVR manual FAQ (cannot search records) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=135 ;; CP Plus datasheet \u2013 KVMS Pro / gCMOB :: https://cpplusworld.com/prodassets/datasheet/CP-UVR-0801E1-CV4.pdf"},{"Level":"Playback","Issue":"No recording found","Software":"All","Step":2,"Question":"Is there any recording on the timeline in the last 24 hours?","Answers":"Yes, some|None","Diagnosis":"None=Recording fully stopped \u2014 Critical","Tip":"","Solution":"None=Vendor: same-day visit \u2014 check HDD status, record schedule and that recording is enabled #HT-SCHEDULE >> Ops: escalate as Critical #HT-OPS-ESCALATE","Source":"Dahua-platform DVR manual FAQ (cannot search records) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=135 ;; Security Wholesalers \u2013 HDD fault: record status before changing anything :: https://www.securitywholesalers.com.au/guides/technical-support-guides/recording-playback-export/nvr-hard-drive-not-detected-beeping-error/"},{"Level":"Playback","Issue":"No recording found","Software":"All","Step":3,"Question":"What is the HDD status in device settings?","Answers":"Normal|Error / Abnormal|Not detected / Uninitialised|Could not open","Diagnosis":"Normal=Disk OK \u2014 schedule / recording disabled or overwritten|Error / Abnormal=Hard disk faulty|Not detected / Uninitialised=HDD not detected / not initialised","Tip":"iVMS: Remote Config \u203a Storage \u203a HDD \u00b7 KVMS / DVR: Storage \u203a HDD Manager","Solution":"Normal=Vendor: check the record schedule and that recording is enabled for this channel #HT-SCHEDULE >> Vendor: check overwrite / retention \u2014 footage may have been overwritten #HT-OVERWRITE|Error / Abnormal=Vendor: power off, reseat HDD cables #HT-RAISE-TICKET >> Vendor: if still Abnormal, \u26a0 format (erases footage) \u2014 if still failing, replace HDD #HT-RAISE-TICKET|Not detected / Uninitialised=Auditor: note the exact status before anyone touches it #HT-HDD-STATUS >> Vendor: check HDD power + SATA cable and port #HT-RAISE-TICKET >> Vendor: \u26a0 initialise only after confirming no footage is needed \u2014 replace if it fails #HT-RAISE-TICKET","Source":"Hikvision support \u2013 HDD error / Abnormal status :: https://supportusa.hikvision.com/support/solutions/articles/17000128918-audible-warning-is-saying-there-is-a-hdd-error ;; Hikvision recorder manual \u2013 check HDD status (Menu \u203a HDD) :: https://www.manualowl.com/m/Hikvision/ERI-Q108-P8/Manual/683049?page=147 ;; Dahua-platform DVR manual FAQ (cannot search records) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=135 ;; Security Wholesalers \u2013 HDD fault: record status before changing anything :: https://www.securitywholesalers.com.au/guides/technical-support-guides/recording-playback-export/nvr-hard-drive-not-detected-beeping-error/"},{"Level":"Playback","Issue":"HDD error / not detected","Software":"All","Step":1,"Question":"What HDD status is shown?","Answers":"Error / Abnormal|Not detected|Uninitialised","Diagnosis":"Uninitialised=HDD needs initialising (erases data)|Error / Abnormal=Hard disk failing|Not detected=Disk dead or cable / SATA port loose","Tip":"","Solution":"Uninitialised=Vendor: \u26a0 initialise only after confirming no footage is needed; replace if initialisation fails #HT-RAISE-TICKET|Error / Abnormal=Vendor: power off and reseat HDD cables #HT-RAISE-TICKET >> Vendor: if still Abnormal, \u26a0 format; if it does not clear, replace HDD #HT-RAISE-TICKET|Not detected=Vendor: check HDD power and SATA cable / port #HT-RAISE-TICKET >> Vendor: confirm the disk size is supported by this DVR #HT-RAISE-TICKET >> Vendor: replace HDD if still not detected #HT-RAISE-TICKET","Source":"Hikvision support \u2013 HDD error / Abnormal status :: https://supportusa.hikvision.com/support/solutions/articles/17000128918-audible-warning-is-saying-there-is-a-hdd-error ;; Dahua-platform DVR manual FAQ (HDD / no video) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=134 ;; Lorex DVR manual \u2013 HDD not detected / overwrite :: https://cdn.lorex.com/downloads/security-dvr/D863/Manuals/EN/LX501214.xml.html"},{"Level":"Playback","Issue":"HDD error / not detected","Software":"All","Step":2,"Question":"Is the DVR beeping at site?","Answers":"Yes|No|Don't know","Diagnosis":"Yes=HDD alarm active","Tip":"","Solution":"Yes=Vendor: urgent \u2014 HDD alarm means recording is at risk #HT-RAISE-TICKET","Source":"Hikvision support \u2013 HDD error / Abnormal status :: https://supportusa.hikvision.com/support/solutions/articles/17000128918-audible-warning-is-saying-there-is-a-hdd-error"},{"Level":"Playback","Issue":"HDD error / not detected","Software":"All","Step":3,"Question":"Last date with recordings?","Answers":"Within 1 day|1\u20137 days|More than 7 days","Diagnosis":"More than 7 days=Long footage gap","Tip":"","Solution":"More than 7 days=Ops: escalate to ops head (footage gap) #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Playback","Issue":"Recording gap (partial)","Software":"All","Step":1,"Question":"When is the gap?","Answers":"During power cut|Random times|Same time every day","Diagnosis":"During power cut=No UPS \u2014 recording stops in power cuts|Same time every day=Recording schedule wrong|Random times=Possible HDD / stream fault","Tip":"","Solution":"During power cut=Ops: UPS for DVR + camera power #HT-OPS-ESCALATE|Same time every day=Vendor: fix the recording schedule (set 24\u00d77) #HT-SCHEDULE|Random times=Vendor: check HDD status and DVR logs for video loss / HDD errors #HT-HDD-STATUS","Source":"SecurityCamCenter \u2013 Dahua event codes (HDD Manager status) :: https://securitycamcenter.com/dahua-error-codes-explained/ ;; Lorex DVR manual \u2013 HDD not detected / overwrite :: https://cdn.lorex.com/downloads/security-dvr/D863/Manuals/EN/LX501214.xml.html"},{"Level":"Playback","Issue":"Recording gap (partial)","Software":"All","Step":2,"Question":"How long is the gap?","Answers":"Under 1 hour|1\u20136 hours|Over 6 hours","Diagnosis":"Over 6 hours=Major gap","Tip":"","Solution":"Over 6 hours=Ops: escalate #HT-OPS-ESCALATE","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Playback","Issue":"HDD full / overwrite off","Software":"All","Step":1,"Question":"Do recordings stop on the date the disk became full?","Answers":"Yes|No|Don't know","Diagnosis":"Yes=Overwrite disabled \u2014 recording stops when full","Tip":"","Solution":"Yes=Vendor: enable HDD overwrite in Storage settings #HT-OVERWRITE >> Auditor: confirm new recordings appear next shift #HT-PLAYBACK","Source":"Lorex DVR manual \u2013 HDD not detected / overwrite :: https://cdn.lorex.com/downloads/security-dvr/D863/Manuals/EN/LX501214.xml.html"},{"Level":"Playback","Issue":"Recording not enabled for channel","Software":"All","Step":1,"Question":"Is only this camera missing recordings?","Answers":"Yes|No, others too","Diagnosis":"Yes=Recording schedule not set for this channel|No, others too=DVR-wide recording problem \u2014 check HDD","Tip":"","Solution":"Yes=Vendor: enable recording / schedule for this channel #HT-SCHEDULE|No, others too=Auditor: log 'HDD error / not detected' and troubleshoot HDD #HT-CHANGE-ISSUE","Source":"Dahua-platform DVR manual FAQ (cannot search records) \u2013 reference for CP Plus UVR :: https://www.manualsdir.com/manuals/734926/dahua-technology-le-l.html?page=135"},{"Level":"Playback","Issue":"Playback slow / not loading","Software":"All","Step":1,"Question":"Tried sub-stream / lower quality?","Answers":"Yes, now it plays|Yes, still slow|Not yet","Diagnosis":"Yes, now it plays=Bandwidth low only \u2014 footage OK|Yes, still slow=Site upload speed too low","Tip":"","Solution":"Yes, now it plays=Auditor: mark playback OK \u2014 no ticket #HT-MARK-OK|Yes, still slow=IT: check site upload speed with ISP #HT-ASK-IT|Not yet=Auditor: switch to sub-stream and retry #HT-STREAM","Source":"Hikvision FAQ \u2013 Live View errors on iVMS-4200 :: https://www.hikvision.com/content/dam/hikvision/en/support/faq/How-to-Solve-Live-View-Error-on-iVMS-4200.pdf"},{"Level":"Playback","Issue":"Playback slow / not loading","Software":"All","Step":2,"Question":"Is live view also slow?","Answers":"Yes|No","Diagnosis":"Yes=Site internet slow","Tip":"","Solution":"Yes=IT: raise with ISP #HT-ASK-IT","Source":"Ops practice (not vendor-sourced) :: "},{"Level":"Playback","Issue":"Wrong date / time in recording","Software":"All","Step":1,"Question":"How far off is the recording time?","Answers":"Minutes|Hours|Days or more","Diagnosis":"Days or more=DVR clock reset|Hours=DVR clock wrong \u2014 footage search mismatch","Tip":"","Solution":"Minutes=IT: enable NTP #HT-SET-TIME|Hours=IT: correct DVR time + NTP; note offset for past footage #HT-SET-TIME|Days or more=Vendor: replace clock battery #HT-RAISE-TICKET >> IT: set time + NTP #HT-SET-TIME","Source":"Hikvision DVR manual \u2013 playback troubleshooting :: https://manualshive.com/en/manual/hikvision/ud01394b/2132219?page=215 ;; Ops practice (not vendor-sourced) :: "}]};

const fmtDT = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('en-IN', {day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true}); };
const fmtTime = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : d.toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit', hour12: true}); };
const hoursSince = s => s ? (Date.now() - new Date(s).getTime()) / 36e5 : 0;

/* ---------------- settings helpers ---------------- */
const setting = (k, d) => { const v = S.cfg.settings[k]; return v === undefined || v === '' ? d : v; };
function shifts() {
  const out = [];
  for (let i = 1; i <= 4; i++) {
    const n = setting('Shift ' + i + ' Name', '');
    if (n) out.push({name: n, start: setting('Shift ' + i + ' Start', '00:00'), end: setting('Shift ' + i + ' End', '23:59')});
  }
  return out.length ? out : [{name: 'Morning', start: '09:00', end: '13:00'}, {name: 'Evening', start: '17:00', end: '21:00'}];
}
const toMin = t => { const m = String(t).match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : 0; };
function currentShift() {
  const sh = shifts(), now = new Date(), m = now.getHours() * 60 + now.getMinutes();
  let pick = sh.find(s => toMin(s.start) <= toMin(s.end) ? (m >= toMin(s.start) && m <= toMin(s.end)) : (m >= toMin(s.start) || m <= toMin(s.end)));
  if (!pick) { const started = sh.filter(s => toMin(s.start) <= m); pick = started.length ? started[started.length - 1] : sh[0]; }
  return pick.name;
}
function shiftEnded(date, shiftName) {
  const t = todayStr();
  if (date < t) return true;
  if (date > t) return false;
  const s = shifts().find(x => x.name === shiftName); if (!s) return false;
  const now = new Date(); return now.getHours() * 60 + now.getMinutes() > toMin(s.end);
}
const slaHours = sev => num(setting('SLA Hours ' + sev, {Critical: 4, High: 24, Medium: 48, Low: 72}[sev] || 48));

  return c && c.Location ? c.Location : '';
}
function critCams(dev) {

}

/* ================= API ================= */
async function post(body) {
  let res;
  try { res = await fetch(conn().url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(body)}); }
  catch (e) { const x = new Error('No connection to server. Check internet and try again.'); x.code = 'NET'; throw x; }
  try { return await res.json(); } catch (e) { throw new Error('Server error (' + res.status + '). Check the Apps Script deployment.'); }
}
async function api(action, payload) {
  if (S.mode === 'demo') return Demo.handle(action, payload || {});
  await ensureSession();
  const j = await post({action, token: S.token, payload: payload || {}});
  if (!j.ok) {
    if (j.code === 'AUTH') { clearSession(); if (S.user) { await ensureSession(j.error); return api(action, payload); } }
    if (/^Unknown action/.test(j.error || '')) { const e = new Error('The Google Sheet backend is an older version and does not support this yet. Admin: Apps Script → Deploy → Manage deployments → ✏️ Edit → Version: New version → Deploy.'); e.code = 'OUTDATED'; throw e; }
    const e = new Error(j.error || 'Request failed'); e.code = j.code; throw e;
  }
  return j;
}

let sessWaiters = [];
function saveSession(j) { S.token = j.token; S.tokenExp = j.exp; LS.set('te_sess', {token: j.token, exp: j.exp}); LS.set('te_last_user', j.user.username); }
function clearSession() { S.token = null; S.tokenExp = 0; LS.del('te_sess'); }
function loadSession() { const x = LS.get('te_sess'); if (x && x.exp - Date.now() > 60000) { S.token = x.token; S.tokenExp = x.exp; return true; } return false; }
function loginForm(id, msg) {
  return `<form id="${id}" autocomplete="on" style="text-align:left">${msg ? `<div class="hint" style="margin-bottom:8px">${esc(msg)}</div>` : ''}
   <label class="lbl">Username</label><input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(LS.get('te_last_user', ''))}" required>
   <label class="lbl">Password</label><div class="row" style="flex-wrap:nowrap"><input type="password" name="password" autocomplete="current-password" required style="flex:1;min-width:0"><button type="button" class="btn sm" data-act="pw-toggle" style="min-height:40px">👁</button></div>
   <div class="err small" style="color:var(--bad);font-weight:600;min-height:18px;margin-top:6px"></div>
   <button class="btn pri block" type="submit" style="min-height:46px">Log in</button></form>`;
}
async function doLogin(form) {
  const u = form.username.value.trim(), pw = form.password.value, err = form.querySelector('.err'), btn = form.querySelector('[type=submit]');
  if (!u || !pw) { err.textContent = 'Enter username and password.'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; err.textContent = '';
  try {
    const j = await post({action: 'login', payload: {username: u, password: pw}});
    if (!j.ok) throw new Error(j.error || 'Login failed');
    if (S.user && j.user.username !== S.user.username) throw new Error('Log in as ' + S.user.username + ' to continue this session, or reload the page.');
    saveSession(j);
    if (form.id === 'relogin') { closeLayer(); const w = sessWaiters; sessWaiters = []; w.forEach(f => f()); toast('Logged in — continuing'); }
    else boot();
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Log in'; form.password.value = ''; form.password.focus(); }
}
async function ensureSession(msg) {
  if (S.token && S.tokenExp - Date.now() > 60000) return;

/* ================= REPORT ENGINE ================= */
function latestAudits(date, shift) {
  const map = {};
  S.data.audits.forEach(a => {
    if (a.Date !== date) return;
    if (shift !== 'All' && a.Shift !== shift) return;
    const k = a['DVR Code'];
    if (!map[k] || String(a['Submitted At']) > String(map[k]['Submitted At'])) map[k] = a;
  });
  return map;
}
function filterDevices(f) {
  return S.cfg.devices.filter(d => (f.city === 'All' || d.City === f.city) && (f.type === 'All' || d.Type === f.type) && (f.sw === 'All' || d.Software === f.sw));
}
function computeReport(f) {
  const shift = f.shift === 'AUTO' ? currentShift() : f.shift;
  const devs = filterDevices(f), la = latestAudits(f.date, shift);
  const r = {shift, devs, la, totalDvr: devs.length, totalCams: 0, audited: 0, pending: 0, online: 0, offline: 0, camsAudited: 0, live: 0, notLive: 0,
    pbErrDvr: 0, pbErrCams: 0, pbNotChecked: 0, healthy: 0, rows: []};
  devs.forEach(d => {
    const inst = num(d['Cameras Installed']); r.totalCams += inst;
    const a = la[d['DVR Code']];
    if (!a) { r.pending++; r.rows.push({d, a: null}); return; }
    r.audited++; r.camsAudited += inst;
    if (a['DVR Online'] === 'Y') r.online++; else r.offline++;
    r.live += num(a['Cameras Live']); r.healthy += num(a['Healthy Cameras']);
    if (a.Playback === 'Error') { r.pbErrDvr++; r.pbErrCams += a['Playback Cameras'] === 'ALL' ? inst : String(a['Playback Cameras']).split(',').filter(x => x.trim()).length; }
    if (a.Playback === 'Not Checked' && a['DVR Online'] === 'Y') r.pbNotChecked++;
    r.rows.push({d, a});
  });
  r.notLive = r.camsAudited - r.live;
  r.livePct = pct(r.live, r.camsAudited); r.healthyPct = pct(r.healthy, r.camsAudited); r.coverage = pct(r.audited, r.totalDvr);
  return r;
}
function excAgeH(x) { return x.Status === 'Resolved' && x['Resolved At'] ? (new Date(x['Resolved At']) - new Date(x['First Seen'])) / 36e5 : hoursSince(x['First Seen']); }
const isLive = x => x.Status !== 'Resolved' && x.Status !== 'Recovered - Verify';  // still broken
function slaBreached(x) { return isLive(x) && excAgeH(x) > slaHours(x.Severity); }
function computeAlerts(r, f) {
  const A = [], codes = new Set(r.devs.map(d => d['DVR Code']));
  const lowPct = num(setting('Low Live % Alert', 70));
  // from the selected shift audit
  r.rows.forEach(({d, a}) => {
    if (!a) return;
    const nm = `${d['Outlet Name']} (${d['DVR Code']})`;
    if (a['DVR Online'] !== 'Y') A.push({lvl: 'Critical', title: 'DVR offline — ' + nm, sub: a['DVR Issue'] + ' · all ' + d['Cameras Installed'] + ' cameras blind', code: d['DVR Code']});
    else {
      if (a.Playback === 'Error' && a['Playback Cameras'] === 'ALL') A.push({lvl: 'Critical', title: 'No recording — ' + nm, sub: a['Playback Issue'] + ' · footage will not be available', code: d['DVR Code']});
      const lp = pct(num(a['Cameras Live']), num(a['Cameras Installed']));
      if (lp < lowPct) A.push({lvl: 'Critical', title: `Only ${lp}% cameras live — ${nm}`, sub: `${a['Cameras Live']}/${a['Cameras Installed']} live (alert below ${lowPct}%)`, code: d['DVR Code']});
    }
  });
  // missed audits
  if (shiftEnded(f.date, r.shift)) {
    const missed = r.rows.filter(x => !x.a).map(x => x.d['Outlet Name']);
    if (missed.length) A.push({lvl: 'High', title: `${missed.length} DVR${missed.length > 1 ? 's' : ''} not audited in ${r.shift} shift`, sub: missed.slice(0, 8).join(', ') + (missed.length > 8 ? ' …' : '')});
  } else if (r.pbNotChecked) A.push({lvl: 'Medium', title: `Playback not checked on ${r.pbNotChecked} online DVR${r.pbNotChecked > 1 ? 's' : ''}`, sub: 'Recording health unknown for these sites'});
  // from active exceptions
  const act = S.data.exceptions.filter(x => x.Status !== 'Resolved' && codes.has(x['DVR Code']));
  const critCam = act.filter(x => x.Severity === 'Critical' && x.Level === 'Camera' && isLive(x));
  critCam.forEach(x => A.push({lvl: 'Critical', title: `Critical camera down — ${x['Outlet Name']} Cam ${x['Camera No']}${camLabel(x['DVR Code'], x['Camera No']) ? ' (' + camLabel(x['DVR Code'], x['Camera No']) + ')' : ''}`, sub: x.Issue + ' · open ' + ageText(excAgeH(x)), exc: x['Exception ID']}));
  const br = act.filter(slaBreached);
  if (br.length) A.push({lvl: 'High', title: `${br.length} exception${br.length > 1 ? 's' : ''} past SLA`, sub: br.slice(0, 5).map(x => `${x['Outlet Name']} ${x.Level === 'Camera' ? 'Cam ' + x['Camera No'] : x.Level} (${ageText(excAgeH(x))})`).join(', '), go: 'sla'});
  const tm = num(setting('Ticket Missing Alert Hours', 2));
  const noT = act.filter(x => !x['Ticket ID'] && isLive(x) && hoursSince(x['First Seen']) > tm);
  if (noT.length) A.push({lvl: 'Medium', title: `${noT.length} exception${noT.length > 1 ? 's' : ''} without Fix Engine ticket after ${tm}h`, sub: 'Raise tickets so vendors are assigned', go: 'noticket'});
  const rv = act.filter(x => x.Status === 'Recovered - Verify');
  if (rv.length) A.push({lvl: 'Medium', title: `${rv.length} issue${rv.length > 1 ? 's' : ''} found working — verify & close`, sub: 'Supervisor: confirm root cause and mark Resolved', go: 'recovered'});
  // repeat offenders
  const ro = rep(codes);
  if (ro.length) A.push({lvl: 'High', title: `${ro.length} DVR${ro.length > 1 ? 's' : ''} with repeat failures — need permanent fix`, sub: ro.slice(0, 6).map(o => `${o.name} (${o.n}×)`).join(', ') + (ro.length > 6 ? ' …' : '') + ` · last ${setting('Repeat Window Days', 30)} days`});
  const rank = {Critical: 0, High: 1, Medium: 2};
  return A.sort((a, b) => rank[a.lvl] - rank[b.lvl]);
}
function rep(codes) {
  const win = num(setting('Repeat Window Days', 30)), th = num(setting('Repeat Threshold', 3));
  const cut = new Date(Date.now() - win * 864e5).toISOString(), by = {};
  S.data.exceptions.forEach(x => {
    if (codes && !codes.has(x['DVR Code'])) return;
    if (String(x['First Seen']) < cut) return;
    const k = x['DVR Code']; by[k] = by[k] || {code: k, name: x['Outlet Name'], n: 0};
    by[k].n += 1 + ((String(x.Notes).match(/Failed again/g) || []).length);

  return Object.values(by).filter(o => o.n >= th).sort((a, b) => b.n - a.n);
}

function trendLine(f, devs) {

function trendChart(f) {

function addImages(files) {

function compressImage(file) {

            if (code === 'RTN01.BLR' && back <= 2) { a.playback = 'Error'; a.playbackIssue = 'HDD error / not detected'; a.playbackCams = 'ALL'; }
            else if (rnd() < 0.03) { a.playback = 'Error'; a.playbackIssue = 'Recording gap (partial)'; a.playbackCams = [1]; }
            else if (rnd() < 0.03) { a.playback = 'Not Checked'; a.remarks = 'Playback too slow on site internet'; }
          }
          const t = new Date(base + idx * 95000 + Math.floor(rnd() * 40000)).toISOString();
          a.startedAt = new Date(new Date(t).getTime() - 80000).toISOString();
          a.camIssues = Object.fromEntries(Object.entries(a.camIssues));
          this.submit(d, {audit: a, evidence: a.dvrOnline === 'N' || a.notLive.length || a.playback === 'Error' ? [{}] : []}, users[dev.City] || users.BLR, t);
        });
      });
    }
    // some lifecycle: tickets on older exceptions, a few resolved
    d.exceptions.forEach((x, i) => {
      if (i % 3 === 0 && hoursSince(x['First Seen']) > 5) { x['Ticket ID'] = 'FF-' + (2400 + i); x['Ticket At'] = x['First Seen']; if (x.Status === 'Open') x.Status = 'Ticket Raised'; }
      if (x.Status === 'Recovered - Verify' && i % 2 === 0) { x.Status = 'Resolved'; x['Resolved At'] = x['Last Seen']; x['Resolved By'] = 'CCTV Supervisor'; x['Root Cause'] = 'Cable / connector'; x['Action Taken'] = 'Connector reseated by vendor'; }
    });
    return d;
  }
};
function critCamsFrom(dev, cameras) {
  const s = new Set(String(dev['Critical Cameras'] || '').split(/[,;\s]+/).filter(Boolean).map(Number));
  cameras.forEach(c => { if (c['DVR Code'] === dev['DVR Code'] && yes(c.Critical)) s.add(num(c['Camera No'])); });
  return s;
}

start();
</script>
